[workspace]
members = ["core", "core-http", "styles-http", "jvm-bridge"]
resolver = "2"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[profile.release]
strip = true
