[package]
name = "govorun-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
schema = ["dep:schemars"]
private-fixtures = []

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio.workspace = true
url = "=2.5.8"
base64 = "=0.22.1"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
regex = "=1.13.1"
blind-rsa-signatures = { version = "=0.18.0", default-features = false }
schemars = { version = "=0.8.22", optional = true, features = ["chrono", "url", "raw_value"] }

[[example]]
name = "export-schema"
required-features = ["schema"]
