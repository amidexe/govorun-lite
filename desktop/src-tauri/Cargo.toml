[package]
name = "govorun-desktop-host"
version = "2.1.92"
edition = "2021"
publish = false

[features]
packaged-native = []
custom-protocol = ["tauri/custom-protocol"]
private-fixtures = ["govorun-core/private-fixtures"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
resvg = { version = "=0.48.1", default-features = false }

[dependencies]
uuid = { version = "=1.26.1", features = ["v4"] }
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.3"
govorun-core = { path = "../../shared/core" }
govorun-core-http = { path = "../../shared/core-http" }
govorun-os-runtime = { path = "../os-runtime", features = ["insertion", "capture", "keyboard", "inference", "applications", "network", "clipboard", "benchmark"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
sha2 = "=0.10.9"
dirs = "=6.0.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "system-proxy"] }
url = "=2.5.8"
tauri-plugin-updater = { version = "=2.11.0", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
base64 = "=0.22.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
security-framework-sys = "=2.17.0"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "6e595d776e9ac594b73e5a180155800f4da6c87d" }
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAttributedString", "NSButton", "NSColor", "NSFont", "NSStatusBarButton", "NSStatusItem", "NSControl", "NSView", "NSHapticFeedback"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSAttributedString", "NSDictionary", "NSString", "NSValue", "NSArray", "NSBundle", "NSData", "NSError", "NSJSONSerialization", "NSUserDefaults", "NSObject", "NSValue"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Registry"] }
