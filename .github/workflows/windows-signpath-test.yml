# DRAFT: review and admit this exact file into the public export before enabling.
# Never run this signing workflow against the private development repository.
name: Windows SignPath installer proof (test certificate only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-signpath-test
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'amidexe/govorun-lite' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.unsigned.outputs.artifact-id }}
      packaging_artifact_id: ${{ steps.packaging.outputs.artifact-id }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Prepare the same Rust and Visual C++ toolchains
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Native dependencies embed __FILE__; keep their cache outside the user profile.
          $env:CARGO_HOME = Join-Path $env:RUNNER_TEMP 'govorun-cargo'
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup override set 1.98.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or !$install) { throw 'Visual C++ toolchain missing' }
          $vcvars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $values = & cmd.exe /d /c ('"' + $vcvars + '" >nul && set')
          if ($LASTEXITCODE -ne 0) { throw 'Visual C++ environment failed' }
          foreach ($value in $values) {
            if ($value -match '^([^=]+)=(.*)$') {
              # Available to the build below without printing the environment.
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], 'Process')
            }
          }
          $flags = @()
          foreach ($prefix in @($env:GITHUB_WORKSPACE, $env:USERPROFILE)) {
            $replacement = if ($prefix -eq $env:GITHUB_WORKSPACE) { 'govorun-source' } else { 'build-home' }
            foreach ($form in (@($prefix, $prefix.Replace('\', '/'), $prefix.ToLowerInvariant(), $prefix.Replace('\', '/').ToLowerInvariant()) | Select-Object -Unique)) {
              $flags += "--remap-path-prefix=$form=$replacement"
            }
          }
          $env:CARGO_ENCODED_RUSTFLAGS = $flags -join [char]0x1f
          & ./desktop/scripts/build-windows.ps1 -PrepareExternalSigning
          git diff --exit-code -- desktop/package-lock.json desktop/src-tauri/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Build changed dependency locks' }
      - name: Reject original build paths in the executable
        shell: pwsh
        run: |
          $bytes = [IO.File]::ReadAllBytes('desktop/target/release/Govorun.exe')
          $blocked = @()
          foreach ($encoding in @([Text.Encoding]::UTF8, [Text.Encoding]::Unicode)) {
            $text = $encoding.GetString($bytes)
            foreach ($prefix in @($env:GITHUB_WORKSPACE, $env:USERPROFILE)) {
              $scope = if ($prefix -eq $env:GITHUB_WORKSPACE) { 'workspace' } else { 'profile' }
              foreach ($form in @($prefix, $prefix.Replace('\', '/'))) {
                if ($text.IndexOf($form, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
                  $blocked += "$scope/$($encoding.WebName)"
                }
              }
            }
          }
          if ($blocked.Count) {
            throw ('Original build path remains; do not sign: ' + (($blocked | Select-Object -Unique) -join ', '))
          }
      - name: Record the source version
        id: metadata
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Upload only our inner signing inputs
        id: unsigned
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signpath-test-input-${{ github.run_id }}
          path: desktop/release/windows/external-signing/signing-input/
          if-no-files-found: error
          retention-days: 3


      - name: Retain public packaging inputs for the separate repack runner
        id: packaging
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nsis-packaging-inputs-${{ github.run_id }}
          path: |
            desktop/release/windows/
            desktop/target/.tauri/NSIS/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  sign-test:
    needs: build
    if: github.repository == 'amidexe/govorun-lite' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      signed_artifact_id: ${{ steps.signed.outputs.artifact-id }}
    # Fresh runner: no checkout, npm, compilation, user machine or other signing keys.
    steps:
      - name: Check the dedicated CI credential
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if (!$env:SIGNPATH_API_TOKEN) { throw 'SIGNPATH_API_TOKEN is not configured' }
      - name: Request a test signature
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 2ec4c26d-4a2d-4959-8dcf-78ffedbe6cb1
          project-slug: govorun-lite
          signing-policy-slug: test-signing
          artifact-configuration-slug: windows-inner-files-zip
          github-artifact-id: ${{ needs.build.outputs.artifact_id }}
          wait-for-completion: true
          output-artifact-directory: signed-test
          parameters: |
            version: ${{ toJSON(needs.build.outputs.version) }}
      - name: Keep the signed inner files for the repack job
        id: signed
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-test-signed-inner-${{ github.run_id }}
          path: signed-test/
          if-no-files-found: error
          retention-days: 3

  repack:
    needs: [build, sign-test]
    if: github.repository == 'amidexe/govorun-lite' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_id: ${{ steps.installers.outputs.artifact-id }}
    # No SignPath token: package only the exact signed payload from this run.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.packaging_artifact_id }}
          path: desktop
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign-test.outputs.signed_artifact_id }}
          path: signed-inner
          merge-multiple: true
          digest-mismatch: error
      - name: Repack the stock full and model-free NSIS installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./desktop/scripts/windows-signpath-package.ps1 -Mode Repack -SignedDirectory (Join-Path $env:GITHUB_WORKSPACE 'signed-inner')
      - name: Upload only the two installers for their outer signature
        id: installers
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-test-unsigned-installers-${{ github.run_id }}
          path: desktop/release/windows/external-signing/installer-signing-input/
          if-no-files-found: error
          retention-days: 3

  sign-installers:
    needs: [build, repack]
    if: github.repository == 'amidexe/govorun-lite' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    # Fresh signing-only runner; no checkout/build scripts and no updater keys.
    steps:
      - name: Request a test signature for both final installers
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 2ec4c26d-4a2d-4959-8dcf-78ffedbe6cb1
          project-slug: govorun-lite
          signing-policy-slug: test-signing
          artifact-configuration-slug: windows-installers-zip
          github-artifact-id: ${{ needs.repack.outputs.artifact_id }}
          wait-for-completion: true
          output-artifact-directory: signed-installers
          parameters: |
            version: ${{ toJSON(needs.build.outputs.version) }}
      - name: Require exactly the expected full and update installers
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'signed-installers'
          $files = @(Get-ChildItem -LiteralPath $root -Recurse -File | ForEach-Object {
            $_.FullName.Substring($root.Length + 1).Replace('\', '/')
          } | Sort-Object)
          if (($files -join '|') -cne 'full/Setup.exe|update/Setup.exe') { throw 'Unexpected signed installer file set' }
      - name: Keep proof artifacts; never publish a test certificate to users
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-test-signed-installers-not-for-distribution-${{ github.run_id }}
          path: signed-installers/
          if-no-files-found: error
          retention-days: 3
