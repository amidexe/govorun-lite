<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Как работает Говорун 2.0</title>
  <desc id="desc">Голос распознаётся на устройстве и превращается в текст. По желанию готовый текст можно улучшить.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8efec"/>
      <stop offset="1" stop-color="#ead7d4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a56f72"/>
      <stop offset="1" stop-color="#74565a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#72565a" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#8f696c"/>
    </marker>
  </defs>

  <rect width="1280" height="560" fill="url(#background)"/>
  <path d="M0 128C176 40 324 177 504 94S838 24 1012 96s196 75 268 32" fill="none" stroke="#ffffff" stroke-width="3" opacity=".34"/>
  <path d="M0 156C176 68 324 205 504 122S838 52 1012 124s196 75 268 32" fill="none" stroke="#ffffff" stroke-width="2" opacity=".24"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="640" y="58" text-anchor="middle" fill="#352c2e" font-size="31" font-weight="750">Как голос становится текстом</text>

    <g filter="url(#shadow)">
      <rect x="55" y="100" width="330" height="150" rx="28" fill="#fffaf8" stroke="#d8c1bf" stroke-width="2"/>
      <rect x="475" y="100" width="330" height="150" rx="28" fill="#fffaf8" stroke="#d8c1bf" stroke-width="2"/>
      <rect x="895" y="100" width="330" height="150" rx="28" fill="#fffaf8" stroke="#d8c1bf" stroke-width="2"/>
    </g>

    <g fill="#a97779">
      <circle cx="103" cy="143" r="22"/>
      <circle cx="523" cy="143" r="22"/>
      <circle cx="943" cy="143" r="22"/>
    </g>
    <g fill="#ffffff" font-size="19" font-weight="750" text-anchor="middle">
      <text x="103" y="150">1</text>
      <text x="523" y="150">2</text>
      <text x="943" y="150">3</text>
    </g>

    <g fill="#352c2e" font-size="26" font-weight="750">
      <text x="88" y="193">Вы говорите</text>
      <text x="508" y="193">Голос → текст</text>
      <text x="928" y="193">Говорун напечатает</text>
    </g>
    <g fill="#806f72" font-size="18">
      <text x="88" y="224">Только после нажатия</text>
      <text x="508" y="224">GigaAM v3 работает на устройстве</text>
      <text x="928" y="224">Текст за вас</text>
    </g>

    <g stroke="#8f696c" stroke-width="4" fill="none" marker-end="url(#arrow)">
      <path d="M385 175H461"/>
      <path d="M805 175H881"/>
    </g>

    <g stroke="#a98385" stroke-width="3" stroke-dasharray="8 9" fill="none" marker-end="url(#arrow)">
      <path d="M640 250V304"/>
      <path d="M980 379H1110V264"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="300" y="318" width="680" height="122" rx="28" fill="url(#accent)"/>
    </g>
    <text x="640" y="365" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="750">По желанию — улучшение текста</text>
    <text x="640" y="400" text-anchor="middle" fill="#f8e9e8" font-size="19">Сервис Говоруна или ваш собственный сервер</text>

    <g transform="translate(370 486)">
      <circle cx="18" cy="18" r="18" fill="#ffffff" opacity=".68"/>
      <path d="m10 18 5 5 11-12" fill="none" stroke="#8d6669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="425" y="512" fill="#5f4e51" font-size="21" font-weight="650">Аудио остаётся на вашем устройстве</text>
  </g>
</svg>
